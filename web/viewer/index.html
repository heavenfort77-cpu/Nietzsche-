<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clown v2 shader viewer</title>
<!-- ===== HTML SHELL ===== -->
<style>
/* ===== CSS: BASE ===== */
:root { --bg: #1e1418; --ink: #f2ebdd; --panel: #2a2024; --accent: #c9604a; --gap: 6px; --radius: 6px; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.3 system-ui, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
/* ===== CSS: LAYOUT ===== */
.stage { position: relative; flex: 1; min-height: 0; }
.stage__canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.bar { display: flex; flex-wrap: wrap; gap: var(--gap); justify-content: center; padding: var(--gap) var(--gap) calc(env(safe-area-inset-bottom) + var(--gap)); background: var(--panel); }
.bar__group { display: flex; gap: var(--gap); align-items: center; }
/* ===== CSS: UI ===== */
.bar__button { min-width: 44px; min-height: 44px; padding: 0 10px; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--ink); border-radius: var(--radius); }
.bar__slider { width: 110px; min-height: 44px; }
.bar__label { font-size: 12px; }
.hud { position: fixed; top: calc(env(safe-area-inset-top) + 6px); left: 8px; pointer-events: none; font-size: 12px; }
/* ===== CSS: STATES ===== */
.is-active { background: var(--accent); }
.is-hidden { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./lib/build/three.module.js", "three/addons/": "./lib/examples/jsm/" } }
</script>
<script type="x-shader/x-vertex" id="toonVert">
#include <common>
#include <skinning_pars_vertex>
#include <fog_pars_vertex>
attribute float _spec;
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vView;
varying float vSpec;
void main() {
  vUv = uv;
  vSpec = _spec;
  #include <beginnormal_vertex>
  #include <skinbase_vertex>
  #include <skinnormal_vertex>
  #include <defaultnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  #include <project_vertex>
  #include <fog_vertex>
  vNormal = normalize(transformedNormal);
  vView = normalize(-mvPosition.xyz);
}
</script>
<script type="x-shader/x-fragment" id="toonFrag">
#include <common>
#include <fog_pars_fragment>
uniform sampler2D uMap;
uniform sampler2D uPaint;
uniform float uHasPaint;
uniform vec2 uCell;
uniform float uPaintAmt;
uniform float uFlake;
uniform float uFlakeScale;
uniform vec3 uKeyDir;
uniform vec3 uKeyCol;
uniform vec3 uFillDir;
uniform vec3 uFillCol;
uniform vec3 uRimCol;
uniform vec3 uRimDir;
uniform vec3 uGradeTint;
uniform float uGradeAmt;
uniform vec3 uShadow;
uniform float uBand1;
uniform float uBand2;
uniform float uSoft;
uniform float uRimPow;
uniform float uSpecPow;
uniform float uSpecCut;
uniform float uSpecOn;
uniform float uMode;
varying vec2 vUv;
varying vec3 vNormal;
varying vec3 vView;
varying float vSpec;
float hash12(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), u.x), mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), u.x), u.y);
}
void main() {
  vec2 uv = vUv + uCell;
  vec3 albedo = texture2D(uMap, uv).rgb;
  if (uHasPaint > 0.5) {
    vec4 p = texture2D(uPaint, uv);
    float keep = step(uFlake, vnoise(vUv * uFlakeScale));
    albedo = mix(albedo, p.rgb, p.a * uPaintAmt * keep);
  }
  vec3 n = normalize(vNormal);
  vec3 v = normalize(vView);
  float h = dot(n, uKeyDir) * 0.5 + 0.5;
  float ramp = 0.5 * smoothstep(uBand1 - uSoft, uBand1 + uSoft, h) + 0.5 * smoothstep(uBand2 - uSoft, uBand2 + uSoft, h);
  vec3 col = albedo * mix(uShadow, uKeyCol, ramp);
  col += albedo * uFillCol * max(dot(n, uFillDir), 0.0);
  float rim = pow(1.0 - max(dot(n, v), 0.0), uRimPow) * smoothstep(0.0, 0.4, dot(n, uRimDir));
  col += albedo * uRimCol * rim;
  float glint = step(uSpecCut, pow(max(dot(n, normalize(uKeyDir + v)), 0.0), uSpecPow));
  col += uKeyCol * glint * vSpec * uSpecOn;
  float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
  col = mix(col, luma * uGradeTint, uGradeAmt);
  col = mix(col, albedo, step(0.5, uMode) * step(uMode, 1.5));
  vec3 wl = vec3(0.888, 0.831, 0.723);
  vec3 ws = vec3(0.451, 0.381, 0.262);
  float t = clamp(dot(albedo - ws, wl - ws) / dot(wl - ws, wl - ws), 0.0, 1.0);
  float isBlouse = step(length(albedo - mix(ws, wl, t)), 0.035);
  col = mix(col, vec3(0.0, isBlouse, 0.0), step(1.5, uMode));
  gl_FragColor = vec4(col, 1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
  #include <fog_fragment>
}
</script>
<script type="x-shader/x-vertex" id="hullVert">
#include <common>
#include <skinning_pars_vertex>
#include <fog_pars_vertex>
uniform float uThick;
void main() {
  #include <beginnormal_vertex>
  #include <skinbase_vertex>
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  transformed += normalize(objectNormal) * uThick;
  #include <project_vertex>
  #include <fog_vertex>
}
</script>
<script type="x-shader/x-fragment" id="hullFrag">
#include <common>
#include <fog_pars_fragment>
uniform vec3 uColor;
void main() {
  gl_FragColor = vec4(uColor, 1.0);
  #include <colorspace_fragment>
  #include <fog_fragment>
}
</script>
</head>
<body>
<main class="stage">
  <canvas id="view" class="stage__canvas" aria-label="Clown viewer"></canvas>
</main>
<p id="hud" class="hud">loading</p>
<nav class="bar" aria-label="Viewer controls">
  <div class="bar__group" data-group="world"></div>
  <div class="bar__group" data-group="clip"></div>
  <div class="bar__group" data-group="face"></div>
  <div class="bar__group">
    <label class="bar__label" for="paint">Paint</label>
    <input id="paint" class="bar__slider" type="range" min="0" max="1" step="0.01" value="1">
    <label class="bar__label" for="flake">Flake</label>
    <input id="flake" class="bar__slider" type="range" min="0" max="1" step="0.01" value="0">
    <button id="outline" class="bar__button is-active" type="button">Outline</button>
  </div>
</nav>
<script type="module">
'use strict';
// ===== MAP =====
// CONFIG  CONFIG (worlds: stage, mirror; shader; outline; faces)
// ASSETS  ASSETS, loadAll()
// STATE   view, newRun()
// RENDER  makeToon(), makeHull(), applyWorld(), applyFace(), resize(), draw()
// INPUT   bindInput()
// UI      buildBar(), markActive(), drawHud()
// SYSTEMS playClip(), stepFps()
// LOOP    frame()
// BOOT    boot(); test hook window.__game = { newRun, state, api } when ?test
// TEST    api.mode(0 lit, 1 texture colour, 2 blouse mask), api.bg(hex) for silhouette checks
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ===== CONFIG =====
const CONFIG = Object.freeze({
  // light values from the approved style study, divided by the stage key strength (3.2) so the stage key is 1
  worlds: Object.freeze({
    stage: Object.freeze({
      // backdrop colour
      bg: '#1E1418',
      // key light direction, toward the light (top-left, in front)
      keyDir: [-0.55, 0.75, 0.6],
      // key light colour (study: 1.0, 0.86, 0.66)
      key: [1.0, 0.86, 0.66],
      // key strength (study 3.2, the reference)
      keyS: 1.0,
      // fill light direction: low from the right
      fillDir: [0.8, 0.2, 0.5],
      // fill colour (study: 0.55, 0.45, 0.45)
      fill: [0.55, 0.45, 0.45],
      // fill strength (study 0.7 / 3.2)
      fillS: 0.22,
      // rim colour (study: 1.0, 0.8, 0.6)
      rim: [1.0, 0.8, 0.6],
      // rim strength (study 2.2 / 3.2)
      rimS: 0.69,
      // rim light direction: from behind and above (study rim sun)
      rimDir: [0.2, 0.5, -0.9],
      // colour grade toward one tint: none on stage
      gradeAmt: 0.0,
      // grade tint (unused on stage)
      gradeTint: '#FFFFFF',
      // colour multiplied into the shadow side (a chosen shade, not grey ambient)
      shadow: [0.46, 0.36, 0.42],
      // outline colour (study: dark warm brown)
      outline: '#1E1714',
    }),
    mirror: Object.freeze({
      // backdrop colour
      bg: '#11272B',
      // key light direction (same as stage)
      keyDir: [-0.55, 0.75, 0.6],
      // key light colour (study: 0.72, 0.86, 0.95)
      key: [0.72, 0.86, 0.95],
      // key strength (study 2.4 / 3.2)
      keyS: 0.75,
      // fill light direction
      fillDir: [0.8, 0.2, 0.5],
      // fill colour (study: 0.35, 0.5, 0.55)
      fill: [0.35, 0.5, 0.55],
      // fill strength (study 0.6 / 3.2)
      fillS: 0.19,
      // rim colour (study: 0.75, 0.92, 1.0)
      rim: [0.75, 0.92, 1.0],
      // rim strength (study 2.6 / 3.2)
      rimS: 0.81,
      // rim light direction: from behind and above
      rimDir: [0.2, 0.5, -0.9],
      // cold grade amount: warm colours read cold in the Mirror World (the plan's cold LUT)
      gradeAmt: 0.6,
      // grade tint: Mirror figure colour M_PALE (hue about 190)
      gradeTint: '#9DB5BB',
      // shadow side colour
      shadow: [0.22, 0.32, 0.40],
      // outline colour (study: Mirror contour)
      outline: '#071315',
    }),
  }),
  shader: Object.freeze({
    // half-Lambert value where the shadow band ends
    band1: 0.42,
    // half-Lambert value where the light band starts
    band2: 0.68,
    // softness of band edges
    soft: 0.04,
    // rim sharpness (pow(1 - N.V, rimPow))
    rimPow: 2.0,
    // glint sharpness (nose, buttons, shoes only)
    specPow: 60.0,
    // glint cut-off: the glint is on or off, no gradient
    specCut: 0.5,
    // flake noise scale across a face cell
    flakeScale: 90.0,
  }),
  // outline thickness in metres
  outlineThick: 0.006,
  // face cells in the 2 x 2 atlas: uv offset from the sad cell
  faces: Object.freeze({ sad: [0, 0], smile: [0.5, 0], startle: [0, -0.5], wince: [0.5, -0.5] }),
  // clips in the GLB
  clips: ['idle', 'walk', 'slap'],
  cam: Object.freeze({
    // camera field of view, degrees
    fov: 30,
    // camera distance, metres
    dist: 5.2,
    // look-at height, metres
    y: 0.95,
  }),
  // pixel-ratio cap on desktop and laptop
  dprDesktop: 2,
  // pixel-ratio cap on touch devices
  dprTouch: 1.5,
  // drag sensitivity: radians per pixel
  turnPerPx: 0.01,
  // longest frame step used for animation, seconds
  dtMax: 0.05,
  // tone mapping exposure
  exposure: 1.15,
});

// ===== ASSETS =====
const ASSETS = Object.freeze({ glb: './assets/clown_v2.glb', face: './assets/face_atlas.png', paint: './assets/face_paint.png' });
async function loadTex(url) {
  const t = await new THREE.TextureLoader().loadAsync(url);
  t.flipY = false; t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  return t;
}
async function loadAll() {
  const [gltf, face, paint] = await Promise.all([new GLTFLoader().loadAsync(ASSETS.glb), loadTex(ASSETS.face), loadTex(ASSETS.paint)]);
  return { gltf, face, paint };
}

// ===== STATE =====
const view = { world: 'stage', clip: 'idle', face: 'sad', paint: 1, flake: 0, outline: true, yaw: 0, fps: 0, paused: false };
function newRun() {
  Object.assign(view, { world: 'stage', clip: 'idle', face: 'sad', paint: 1, flake: 0, outline: true, yaw: 0, paused: false });
  applyWorld(); applyFace(); playClip(view.clip); syncInputs();
}

// ===== RENDER =====
const canvas = document.getElementById('view');
const isTest = new URLSearchParams(location.search).has('test');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: isTest });
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = CONFIG.exposure;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CONFIG.cam.fov, 1, 0.1, 50);
const parts = { root: null, body: null, face: null, hull: null, mixer: null, clips: {} };
const shared = {
  uKeyDir: { value: new THREE.Vector3() }, uKeyCol: { value: new THREE.Color() }, uFillDir: { value: new THREE.Vector3() },
  uFillCol: { value: new THREE.Color() }, uRimCol: { value: new THREE.Color() }, uShadow: { value: new THREE.Color() },
  uRimDir: { value: new THREE.Vector3() }, uGradeTint: { value: new THREE.Color() }, uGradeAmt: { value: 0 },
  uSpecOn: { value: 1 }, uMode: { value: 0 },
};
const keyWorld = new THREE.Vector3();
const fillWorld = new THREE.Vector3();
const rimWorld = new THREE.Vector3();
function shaderText(id) { return document.getElementById(id).textContent; }
function makeToon(map, paint) {
  const s = CONFIG.shader;
  const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    uMap: { value: map }, uPaint: { value: paint || map }, uHasPaint: { value: paint ? 1 : 0 }, uCell: { value: new THREE.Vector2() },
    uPaintAmt: { value: 1 }, uFlake: { value: 0 }, uFlakeScale: { value: s.flakeScale }, uBand1: { value: s.band1 }, uBand2: { value: s.band2 },
    uSoft: { value: s.soft }, uRimPow: { value: s.rimPow }, uSpecPow: { value: s.specPow }, uSpecCut: { value: s.specCut },
  }]);
  Object.assign(uniforms, shared);
  return new THREE.ShaderMaterial({ uniforms, vertexShader: shaderText('toonVert'), fragmentShader: shaderText('toonFrag'), fog: true });
}
function makeHull(body, face) {
  const strip = (g) => { const c = g.clone(); for (const k of Object.keys(c.attributes)) if (!['position', 'normal', 'skinIndex', 'skinWeight'].includes(k)) c.deleteAttribute(k); return c; };
  const hullGeo = mergeGeometries([strip(body.geometry), strip(face.geometry)], false);
  const hullMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uThick: { value: CONFIG.outlineThick }, uColor: { value: new THREE.Color() } }]),
    vertexShader: shaderText('hullVert'), fragmentShader: shaderText('hullFrag'), side: THREE.BackSide, fog: true,
  });
  const hull = new THREE.SkinnedMesh(hullGeo, hullMat);
  hull.bind(body.skeleton, body.bindMatrix);
  hull.frustumCulled = false;
  hull.position.copy(body.position); hull.quaternion.copy(body.quaternion); hull.scale.copy(body.scale);
  return hull;
}
function applyWorld() {
  const w = CONFIG.worlds[view.world];
  scene.background = new THREE.Color(w.bg);
  keyWorld.fromArray(w.keyDir).normalize(); fillWorld.fromArray(w.fillDir).normalize();
  shared.uKeyCol.value.fromArray(w.key).multiplyScalar(w.keyS);
  shared.uFillCol.value.fromArray(w.fill).multiplyScalar(w.fillS);
  shared.uRimCol.value.fromArray(w.rim).multiplyScalar(w.rimS);
  shared.uShadow.value.fromArray(w.shadow);
  rimWorld.fromArray(w.rimDir).normalize();
  const tint = new THREE.Color(w.gradeTint);
  shared.uGradeTint.value.copy(tint).multiplyScalar(1 / Math.max(tint.r * 0.2126 + tint.g * 0.7152 + tint.b * 0.0722, 1e-3));
  shared.uGradeAmt.value = w.gradeAmt;
  if (parts.hull) parts.hull.material.uniforms.uColor.value.set(w.outline);
  markActive('world', view.world);
}
function applyFace() {
  const u = parts.face.material.uniforms;
  u.uCell.value.fromArray(CONFIG.faces[view.face]);
  u.uPaintAmt.value = view.paint; u.uFlake.value = view.flake;
  parts.hull.visible = view.outline;
  markActive('face', view.face);
  document.getElementById('outline').classList.toggle('is-active', view.outline);
}
function resize() {
  const touch = matchMedia('(pointer: coarse)').matches;
  const dpr = Math.min(devicePixelRatio || 1, touch ? CONFIG.dprTouch : CONFIG.dprDesktop);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width === Math.round(w * dpr) && canvas.height === Math.round(h * dpr)) return;
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  const fit = camera.aspect < 0.8 ? 0.8 / camera.aspect : 1;
  camera.position.set(0, CONFIG.cam.y, CONFIG.cam.dist * fit);
  camera.lookAt(0, CONFIG.cam.y, 0); camera.updateProjectionMatrix();
}
function draw() {
  camera.updateMatrixWorld();
  shared.uKeyDir.value.copy(keyWorld).transformDirection(camera.matrixWorldInverse);
  shared.uFillDir.value.copy(fillWorld).transformDirection(camera.matrixWorldInverse);
  shared.uRimDir.value.copy(rimWorld).transformDirection(camera.matrixWorldInverse);
  if (parts.root) parts.root.rotation.y = view.yaw;
  renderer.render(scene, camera);
}

// ===== INPUT =====
let dragX = null;
function bindInput() {
  canvas.addEventListener('pointerdown', (e) => { dragX = e.clientX; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (dragX === null) return; view.yaw += (e.clientX - dragX) * CONFIG.turnPerPx; dragX = e.clientX; });
  addEventListener('pointerup', () => { dragX = null; });
  addEventListener('blur', () => { dragX = null; });
  addEventListener('keydown', onKey);
  document.getElementById('paint').addEventListener('input', (e) => { view.paint = Number(e.target.value); applyFace(); });
  document.getElementById('flake').addEventListener('input', (e) => { view.flake = Number(e.target.value); applyFace(); });
  document.getElementById('outline').addEventListener('click', () => { view.outline = !view.outline; applyFace(); });
}
function onKey(e) {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { Digit1: 'idle', Digit2: 'walk', Digit3: 'slap' };
  if (map[e.code]) playClip(map[e.code]);
  if (e.code === 'KeyM') { view.world = view.world === 'stage' ? 'mirror' : 'stage'; applyWorld(); }
  if (e.code === 'ArrowLeft') view.yaw -= 0.2;
  if (e.code === 'ArrowRight') view.yaw += 0.2;
}

// ===== UI =====
const hud = document.getElementById('hud');
function buildBar() {
  const groups = { world: Object.keys(CONFIG.worlds), clip: CONFIG.clips, face: Object.keys(CONFIG.faces) };
  for (const [g, names] of Object.entries(groups)) {
    const box = document.querySelector(`[data-group="${g}"]`);
    for (const n of names) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'bar__button'; b.textContent = n; b.dataset.name = n;
      b.addEventListener('click', () => onPick(g, n));
      box.appendChild(b);
    }
  }
}
function onPick(group, name) {
  if (group === 'clip') { playClip(name); return; }
  view[group] = name;
  if (group === 'world') applyWorld(); else applyFace();
}
function markActive(group, name) {
  for (const b of document.querySelectorAll(`[data-group="${group}"] .bar__button`)) b.classList.toggle('is-active', b.dataset.name === name);
}
function syncInputs() {
  document.getElementById('paint').value = String(view.paint);
  document.getElementById('flake').value = String(view.flake);
}
function drawHud() {
  const i = renderer.info.render;
  hud.textContent = `${view.fps.toFixed(0)} fps · ${i.calls} draws · ${i.triangles} tris · ${view.world} · ${view.clip}`;
}

// ===== SYSTEMS =====
function playClip(name) {
  if (!parts.mixer) return;
  parts.mixer.stopAllAction();
  parts.mixer.clipAction(parts.clips[name]).reset().play();
  view.clip = name; markActive('clip', name);
}
let fpsAcc = 0, fpsN = 0;
function stepFps(dt) {
  fpsAcc += dt; fpsN++;
  if (fpsAcc < 0.5) return;
  view.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0;
}

// ===== LOOP =====
let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const raw = (now - last) / 1000 || 0;
  last = now;
  stepFps(raw);
  resize();
  if (parts.mixer && !view.paused) parts.mixer.update(Math.min(raw, CONFIG.dtMax));
  draw(); drawHud();
}

// ===== BOOT =====
function setupModel(a) {
  parts.root = a.gltf.scene; scene.add(parts.root);
  parts.root.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    if (o.material.name === 'face') parts.face = o; else parts.body = o;
  });
  parts.body.material = makeToon(parts.body.material.map, null);
  parts.face.material = makeToon(a.face, a.paint);
  parts.hull = makeHull(parts.body, parts.face);
  parts.body.parent.add(parts.hull);
  parts.mixer = new THREE.AnimationMixer(parts.root);
  for (const c of a.gltf.animations) parts.clips[c.name] = c;
}
function testApi() {
  return {
    set(o) { Object.assign(view, o); applyWorld(); applyFace(); },
    pose(clip, t) { playClip(clip); view.paused = true; parts.mixer.setTime(t); parts.root.updateMatrixWorld(true); },
    show(o) { parts.body.visible = o.body; parts.face.visible = o.face; parts.hull.visible = o.hull; },
    mode(m) { shared.uMode.value = m; },
    bg(hex) { scene.background = hex ? new THREE.Color(hex) : new THREE.Color(CONFIG.worlds[view.world].bg); },
    spec(on) { shared.uSpecOn.value = on ? 1 : 0; },
    render() { draw(); return { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, w: canvas.width, h: canvas.height }; },
    hullBoundToBody() { return parts.hull.isSkinnedMesh === true && parts.hull.skeleton === parts.body.skeleton; },
  };
}
async function boot() {
  buildBar(); bindInput();
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { view.paused = document.hidden; });
  try { setupModel(await loadAll()); } catch (e) { hud.textContent = 'Load failed: ' + e.message; throw e; }
  newRun(); resize();
  if (isTest) window.__game = { newRun, state: () => view, api: testApi() };
  requestAnimationFrame(frame);
}
boot();
</script>
</body>
</html>
