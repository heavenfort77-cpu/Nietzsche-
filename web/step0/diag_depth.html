    for (let y = 0; y < truth.h; y++) for (let x = 0; x < truth.w; x++) { const a = ((truth.h - 1 - y) * truth.w + x) * 4, b = (y * truth.w + x) * 4;
      const za = (got[a] * 256 + got[a + 1]) / 65535 * SHOT.depthFar, zb = (truth.px[b] * 256 + truth.px[b + 1]) / 65535 * SHOT.depthFar; const e = Math.abs(za - zb); if (e > 0.01) bad++; if (e > worst) worst = e; }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    return bad === 0 ? 'same as the file' : `${bad} pixels differ, worst ${worst.toFixed(2)} m`;
  };
  const rows = [['Depth picture through the image decoder (itch build now)', texCheck(tex)], ['Depth picture read as bytes (the fix)', texCheck(tex2)]];
  // 2. plate depth written by the game's shader, then test people (vertical boards standing on the hall floor near its far end), drawn with depth test
  const truthZ = (u, v) => { const x = Math.min(truth.w - 1, Math.max(0, Math.floor(u * truth.w))), y = Math.min(truth.h - 1, Math.max(0, Math.floor(v * truth.h))), i = (y * truth.w + x) * 4; return (truth.px[i] * 256 + truth.px[i + 1]) / 65535 * SHOT.depthFar; };
  const boards = []; for (const by of [6.5, 7.2, 7.8, 8.1]) for (let bx = -1.0; bx <= 1.0001; bx += 0.5) boards.push([bx, by]);
  const VB = `#version 300 es
in vec3 p; uniform mat4 uPV; void main() { gl_Position = uPV * vec4(p, 1.0); }`;
  const pb = prog(gl, VB, `#version 300 es
precision highp float; out vec4 o; void main() { o = vec4(1.0, 0.0, 0.0, 1.0); }`);
  const tri = []; for (const [bx, by] of boards) { const x0 = bx - 0.2, x1 = bx + 0.2, z = -by; tri.push(x0, 0, z, x1, 0, z, x0, 1.8, z, x1, 0, z, x1, 1.8, z, x0, 1.8, z); }
  const bbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bbuf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(tri), gl.STATIC_DRAW);
  const cases = [['itch build now', 0.1, gamePrec, tex], ['the fix: bytes read directly', 0.1, gamePrec, tex2], ['fix, as mediump', 0.1, 'mediump', tex2]];
  let verdict = '';
  for (const [name, near, prec, tx] of cases) {
    const pp = prog(gl, VQ, GLSL1(prec) + FRAG);
    gl.viewport(0, 0, BW, BH); gl.clearColor(0, 0, 0, 1); gl.clearDepth(1); gl.enable(gl.DEPTH_TEST); gl.depthMask(true);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.depthFunc(gl.ALWAYS); gl.useProgram(pp); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.uniform1i(gl.getUniformLocation(pp, 'uDepth'), 0); gl.uniform1f(gl.getUniformLocation(pp, 'uNear'), near); gl.uniform1f(gl.getUniformLocation(pp, 'uFar'), FAR); gl.uniform1f(gl.getUniformLocation(pp, 'uDepthFar'), SHOT.depthFar);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad); loc = gl.getAttribLocation(pp, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // projection x view, column-major
    const f = 1 / T, P = [f / ASP, 0, 0, 0, 0, f, 0, 0, 0, 0, (FAR + near) / (near - FAR), -1, 0, 0, 2 * FAR * near / (near - FAR), 0];
    const Vm = [R[0], U[0], -F[0], 0, R[1], U[1], -F[1], 0, R[2], U[2], -F[2], 0, -dot(R, SHOT.pos), -dot(U, SHOT.pos), dot(F, SHOT.pos), 1];
    const PV = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += P[k * 4 + r] * Vm[c * 4 + k]; PV[c * 4 + r] = s; }
    gl.depthFunc(gl.LESS); gl.useProgram(pb); gl.uniformMatrix4fv(gl.getUniformLocation(pb, 'uPV'), false, PV);
    gl.bindBuffer(gl.ARRAY_BUFFER, bbuf); loc = gl.getAttribLocation(pb, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0); gl.drawArrays(gl.TRIANGLES, 0, tri.length / 3);
    const px = new Uint8Array(BW * BH * 4); gl.readPixels(0, 0, BW, BH, gl.RGBA, gl.UNSIGNED_BYTE, px);
    // sample points on each board: should show where the file's depth is farther than the board by over 0.15 m
    let want = 0, lost = 0; const lostH = [0, 0, 0, 0, 0, 0];
    for (const [bx, by] of boards) for (let i = 1; i < 8; i++) for (let j = 1; j < 18; j++) {
      const w = [bx - 0.2 + 0.4 * i / 8, 1.8 * j / 18, -by], v = view(w); if (v[2] <= 0) continue;
      const u = v[0] / (v[2] * T * ASP) * 0.5 + 0.5, s = 0.5 - v[1] / (v[2] * T) * 0.5; if (u <= 0 || u >= 1 || s <= 0 || s >= 1) continue;
      let zmin = 1e9; for (let dy = -1.5; dy <= 1.5; dy += 1.5) for (let dx = -1.5; dx <= 1.5; dx += 1.5) zmin = Math.min(zmin, truthZ(u + dx / truth.w, s + dy / truth.h));
      // points within 1.5 plate pixels of a nearer surface are left out (edge rounding)
      if (zmin <= v[2] + 0.15) continue;
      want++; const k = ((BH - 1 - Math.floor(s * BH)) * BW + Math.floor(u * BW)) * 4;
      if (px[k] < 128) { lost++; lostH[Math.min(5, Math.floor(w[1] / 0.3))]++; } }
    rows.push([`${name} (${prec})`, `${lost} of ${want} board points hidden wrongly` + (lost ? ` · by height 0-1.8 m: ${lostH.join(' ')}` : '')]);
    if (name === 'itch build now') verdict = (lost ? `Itch build now: FAIL, ${lost} of ${want} points hidden wrongly.` : `Itch build now: PASS (${want} points).`);
    if (name === 'the fix: bytes read directly') verdict += lost ? ` The fix: FAIL, ${lost} of ${want}.` : ` The fix: PASS, all ${want} points drawn.`;
  }
  document.getElementById('v').textContent = verdict;
  document.getElementById('t').innerHTML = rows.map((r) => `<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('');
}
document.getElementById('go').onclick = () => run().catch((e) => { document.getElementById('v').textContent = 'Error: ' + e.message; });
</script></body></html>
