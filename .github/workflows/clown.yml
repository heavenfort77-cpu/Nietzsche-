# Clown v2 build and every check, on GitHub's 4-core runners.
# Owner requirement 6: runs only when the commit subject starts with [checks] (gpu job: [gpu]) or on a manual run; a tag elsewhere in the message does not count.
# build: Blender pipeline (steps 1-3). Then in parallel: model/GLB/deformation gates, mutation run,
# high-quality renders, browser checks for step 4. collect: commits reports, renders and the GLB to ci-out/run-<n>.
name: clown
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
defaults:
  run:
    # explicit bash adds pipefail, so a crash before a tee still fails the step
    shell: bash
env:
  APPROVED: ${{ github.workspace }}/art/3_blender_3d
  WEB: ${{ github.workspace }}/web
  PYTHONUNBUFFERED: '1'
jobs:
  # Rule 2 gate: every "Batch " commit in this push updates HANDOFF.md. A few seconds; blocks nothing else.
  handoff:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: bash tools/check_handoff.sh "${{ github.event.before || 'HEAD~1' }}" "${{ github.sha }}"
      - run: bash tools/check_faults.sh "${{ github.event.before || 'HEAD~1' }}" "${{ github.sha }}"
      - run: bash tools/test_check_panel.sh && bash tools/check_panel.sh
  step0:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-latest
    # smoke_walk.cjs took 9.5 min locally with the walk-back and room cases (session 12), 3 min before; smoke_night1.cjs (3 screens) plus 7 desktop mutations added session 15
    # session 17: 26 night-1 mutations, each stops after its own step (UNTIL); the full desktop pass took 4.8 min locally (guess for CI: 2-5 min a mutation)
    # session 18: 7 more mutations (57 in all); 160 -> 240 min (a guess: no CI run of the 50-mutation list exists yet)
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Step 0 cue checks (static, bot sweep, wide probes, mutations, browser probes) and game page input and loop probes
        run: |
          npm i --prefix /tmp/n --no-save acorn acorn-walk playwright-core > /dev/null
          export NODE_PATH=/tmp/n/node_modules
          python -m pip install -q numpy pillow
          bash web/step0/cube25d/setup.sh
          cd web
          # every check runs even after one fails (a check that did not run is not a pass); the step fails on any failed exit or FAIL line
          rc=0
          node check-static.cjs step0/cue.html | tee step0.txt || rc=1
          node step0/test_cue.cjs | tee -a step0.txt || rc=1
          node step0/smoke_cue.cjs | tee -a step0.txt || rc=1
          node check_input_loop.cjs game/index.html | tee -a step0.txt || rc=1
          node check-static.cjs step0/walk.html | tee -a step0.txt || rc=1
          node step0/smoke_walk.cjs | tee -a step0.txt || rc=1
          python -I game/probe_face_cells.py game/index.html game/assets/clown_v2.glb game/assets/face_atlas.png | tee -a step0.txt || rc=1
          node check-static.cjs step0/night1.html | tee -a step0.txt || rc=1
          node step0/smoke_night1.cjs /tmp/night1 | tee -a step0.txt || rc=1
          node step0/probe_cover.cjs step0 | tee -a step0.txt || rc=1
          node step0/probe_shop.cjs step0 | tee -a step0.txt || rc=1
          ! grep -q '^FAIL\|RESULT FAIL' step0.txt && [ "$rc" = 0 ]
  # session 25: the night1 mutations (web/step0/n1_mutations.txt) on 8 runners at once; each runs every 8th line (they ran one after another in step0 before)
  n1mut:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: night1 mutations, shard ${{ matrix.shard }} of 8 (each must FAIL its own step)
        run: |
          npm i --prefix /tmp/n --no-save playwright-core > /dev/null
          export NODE_PATH=/tmp/n/node_modules
          bash web/step0/cube25d/setup.sh
          cd web
          rc=0; i=0; : > mut.txt
          while IFS=$'\t' read -r k want; do
            case "$k" in ''|'#'*) continue;; esac
            i=$((i+1)); [ $(( (i-1) % 8 )) = ${{ matrix.shard }} ] || continue
            if MUTATE=$k UNTIL="$want" ONLY=desk node step0/smoke_night1.cjs /tmp/night1m > m_$k.txt 2>&1; then echo "FAIL night1 mutation $k: not caught (smoke passed)" | tee -a mut.txt; rc=1
            elif grep 'FAIL' m_$k.txt | grep -qF -- "$want"; then echo "PASS night1 mutation $k: caught ($(grep RESULT m_$k.txt))" | tee -a mut.txt
            else echo "FAIL night1 mutation $k: failed on another step" | tee -a mut.txt; { grep 'FAIL\|RESULT' m_$k.txt || tail -c 600 m_$k.txt; } | tee -a mut.txt; rc=1; fi
          done < step0/n1_mutations.txt
          echo "RESULT shard ${{ matrix.shard }}: $(grep -c '^PASS' mut.txt) caught of $(grep -c 'mutation' mut.txt)"
          [ "$rc" = 0 ]
  # session 25: the timing games (cue_model.html), the route mixer, the four rooms, nights 2-3, the Performer and the ending; each with its mutations
  nights:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { part: [games, nights, gamemut, nightmut] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: ${{ matrix.part }}
        run: |
          npm i --prefix /tmp/n --no-save playwright-core > /dev/null
          export NODE_PATH=/tmp/n/node_modules
          bash web/step0/cube25d/setup.sh
          cd web/step0
          case ${{ matrix.part }} in
            games) node smoke_games.cjs ;;
            nights) node smoke_nights.cjs /tmp/nights ;;
            gamemut) MUTATE=all node smoke_games.cjs ;;
            nightmut) MUTATE=all node smoke_nights.cjs /tmp/nightsm ;;
          esac
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]') || startsWith(github.event.head_commit.message, '[gpu]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Blender and image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          pip install -q bpy==5.3.0 numpy pillow pyflakes
      - name: Lint
        run: cd clown_v2 && python -m pyflakes *.py
      - name: Step 1 probe, steps 2-3 build
        run: |
          cd clown_v2
          python -I probe_bpy.py out/probe | tee -a out_log.txt
          python -I s2_build.py out | tee -a out_log.txt
          python -I s2_shell.py out | tee -a out_log.txt
          python -I s3_rig.py out | tee -a out_log.txt
          python -I probe_clip_loop.py out/clown_v2.glb | tee -a out_log.txt
          mut=$(MUTATE=1 python -I probe_clip_loop.py out/clown_v2.glb || true)
          if echo "$mut" | grep -q '^FAIL  clip walk'; then echo 'PASS clip loop mutation: a 20 deg pop is caught' | tee -a out_log.txt; else echo 'FAIL clip loop mutation: a 20 deg pop is not caught' | tee -a out_log.txt; fi
          mv out_log.txt out/build_log.txt
          ! grep -q '^FAIL' out/build_log.txt
      - uses: actions/upload-artifact@v4
        with: { name: out, path: clown_v2/out, retention-days: 3 }

  ring:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]') || startsWith(github.event.head_commit.message, '[gpu]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Blender and image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          pip install -q bpy==5.3.0 numpy pillow pyflakes
      - name: Step 5a ring set, full bake
        run: |
          python -m pyflakes ring/s5_ring.py
          python -I ring/s5_ring.py ring_out | tee ring_log.txt
          mv ring_log.txt ring_out/
          ! grep -q '^FAIL' ring_out/ring_log.txt
      - uses: actions/upload-artifact@v4
        with: { name: ring, path: ring_out, retention-days: 3 }

  gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          pip install -q bpy==5.3.0 numpy pillow
          cd web && npm install --silent
      - uses: actions/download-artifact@v4
        with: { name: out, path: clown_v2/out }
      - name: Model, GLB and deformation gates, then the mutation run
        run: |
          cd clown_v2
          python -I check_model.py out/rigged.blend out/face_atlas.png | tee gates.txt
          python -I check_glb.py out/clown_v2.glb | tee -a gates.txt
          python -I s3_check.py out | tee -a gates.txt
          python -I mutate_all.py | tee mutations.txt
          ! grep -q '^FAIL' gates.txt mutations.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gates, path: 'clown_v2/*.txt', retention-days: 3 }

  renders:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          pip install -q bpy==5.3.0 numpy pillow
      - uses: actions/download-artifact@v4
        with: { name: out, path: clown_v2/out }
      - name: Four views at 1024 and 48 samples, pose sheets and GIFs
        run: |
          cd clown_v2 && mkdir -p renders
          UNIT=0.03 python -I render_check.py out/low.blend renders/clown_v2 1024 48 front,three_quarter,side,back
          python -I s3_check.py out --sheet --clips=idle
          cp out/pose_sheet_*.jpg out/*.gif renders/
      - uses: actions/upload-artifact@v4
        with: { name: renders, path: clown_v2/renders, retention-days: 3 }

  web:
    needs: [build, ring]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: out, path: clown_v2/out }
      - uses: actions/download-artifact@v4
        with: { name: ring, path: ring_out }
      - name: Game page checks (steps 4 and 5)
        run: |
          bash web/ci_setup.sh
          cd web
          cp ../clown_v2/out/clown_v2.glb ./clown_v2.glb
          node check-static.cjs game/index.html | tee web.txt
          node check_step4.mjs game index.html shot | tee -a web.txt
          node mutate_step4.mjs | tee -a web.txt
          node check_step5.mjs game index.html shot | tee -a web.txt
          node mutate_step5.mjs | tee -a web.txt
          node check_perf.mjs game index.html | tee -a web.txt
          node check-runtime.cjs game/index.html runtime 6 2>&1 | tee -a web.txt
          node run_page.mjs . check_clown.html PROBE | tee -a web.txt
          cp ../clown_v2/out/probe/anim_test.glb ./probe_anim.glb
          node run_page.mjs . probe.html PROBE | tee -a web.txt
          ! grep -q '^FAIL\|^  FAIL\|RESULT FAIL' web.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web
          retention-days: 3
          path: |
            web/web.txt
            web/shot_*.png
            web/runtime/*.png

  perf:
    # the Dawnpunk lag-report mistakes put back one at a time; each perf gate must fail on its mistake
    needs: [build, ring]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          # at most 4 per shard: about 8 min each, so a shard stays well inside the 60 min limit
          - dense,aofullres,nocull,bigtex
          - maxdpr,aosamples,govstuck,sixlights
          - litset,bigshadow,inlined,aniso
          - zerolight,latefetch,hudevery,mmframe
          - nowarm,crowdnocull,noctx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: out, path: clown_v2/out }
      - uses: actions/download-artifact@v4
        with: { name: ring, path: ring_out }
      - name: Perf mutations
        run: |
          bash web/ci_setup.sh
          cd web
          node mutate_perf.mjs ${{ matrix.shard }} | tee perf.txt
          grep -q 'RESULT perf mutations \([0-9]*\) of \1 fired' perf.txt
          ! grep -q '^FAIL' perf.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf_${{ strategy.job-index }}
          retention-days: 3
          path: web/perf.txt

  gpu:
    # real-GPU frame times on GitHub's Apple-silicon Mac runner. Mac minutes cost about 10x Linux on a private repo,
    # so this runs only when asked: manual run, or "[gpu]" in the commit message
    needs: [build, ring]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[gpu]')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@v4
        with: { name: out, path: clown_v2/out }
      - uses: actions/download-artifact@v4
        with: { name: ring, path: ring_out }
      - name: Frame times on the Mac GPU
        env:
          # control page timed in the same job (same VM): the game page before session 8 batch 2 (same page as run 10)
          GPU_CONTROL_SHA: 1356a358e24548d96980a71d27d54d520cb17962
        run: |
          bash web/ci_setup.sh
          git fetch -q --depth=1 origin "$GPU_CONTROL_SHA"
          git show FETCH_HEAD:web/game/index.html > web/game/control.html
          cd web
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|VRAM' | tee gpu.txt || true
          node gpu_measure.mjs game index.html control.html 2>&1 | tee -a gpu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu
          retention-days: 3
          path: web/gpu.txt

  cast:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]')
    # step 6: the other humanoid characters through the same scripts (chars/<name>.py), every gate per character,
    # a side-by-side with the approved model, and the compressed desktop GLB size
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        char: [whiteface, performer, stagehand]
    env:
      CHAR: ${{ matrix.char }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Blender and image libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
          pip install -q bpy==5.3.0 numpy pillow pyflakes
      - name: Build, gates, pose sheets
        run: |
          cd clown_v2
          python -m pyflakes chars/*.py
          O=out_${CHAR}
          python -I s2_build.py $O | tee log.txt
          python -I s2_shell.py $O | tee -a log.txt
          python -I s3_rig.py $O | tee -a log.txt
          python -I probe_clip_loop.py $O/clown_v2.glb | tee -a log.txt
          python -I check_model.py $O/rigged.blend $O/face_atlas.png | tee -a log.txt
          python -I check_glb.py $O/clown_v2.glb | tee -a log.txt
          python -I s3_check.py $O --sheet | tee -a log.txt
          if [ "$CHAR" = whiteface ]; then python -I mutate_shell.py $O | tee -a log.txt; fi
          if [ "$CHAR" = stagehand ]; then CHAR=whiteface python -I s2_build.py out_mutpaint > /dev/null; CHAR=whiteface python -I mutate_paint_empty.py out_mutpaint | tee -a log.txt; fi
          mkdir -p ../cast_out/$CHAR
          cp log.txt $O/*.glb $O/*.png $O/*.jpg $O/*.gif $O/gates_*.json ../cast_out/$CHAR/
          ! grep -q '^FAIL' log.txt
      - name: Side-by-side with the approved model (same camera, lights, scale)
        # crew have no approved 3D model to compare with
        if: matrix.char != 'stagehand'
        run: |
          python -I art/3_blender_3d/render3d.py $CHAR > /dev/null
          cd clown_v2 && O=out_${CHAR} && mkdir -p sbs
          UNIT=0.03 python -I render_check.py $O/low.blend sbs/${CHAR}_v2 1024 48 front,three_quarter,side,back > /dev/null
          python -I side_by_side.py $CHAR ../art/3_blender_3d/renders3d sbs/${CHAR}_v2 ../cast_out/$CHAR/side_by_side.jpg | tee sbs.txt
          cp sbs/*.png ../cast_out/$CHAR/
          cat sbs.txt >> ../cast_out/$CHAR/log.txt
          ! grep -q '^FAIL' sbs.txt
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Compressed GLB (meshopt geometry, KTX2 ETC1S textures) and size gate
        run: |
          curl -sSL -o ktx.deb https://github.com/KhronosGroup/KTX-Software/releases/download/v4.3.2/KTX-Software-4.3.2-Linux-x86_64.deb
          sudo apt-get install -y -qq ./ktx.deb > /dev/null
          toktx --version
          cd clown_v2 && O=out_${CHAR}
          GT="npx -y @gltf-transform/cli@4.1.1"
          $GT dedup $O/clown_v2.glb c1.glb
          $GT prune c1.glb c2.glb
          $GT etc1s c2.glb c3.glb
          # one quantization volume for the whole scene: per-mesh volumes cloned the shared skin for the head (run 12)
          $GT meshopt c3.glb ../cast_out/$CHAR/${CHAR}_desktop.glb --quantization-volume scene
          $GT inspect ../cast_out/$CHAR/${CHAR}_desktop.glb --format md > ../cast_out/$CHAR/inspect_desktop.md
          python -I check_size.py $O/clown_v2.glb ../cast_out/$CHAR/${CHAR}_desktop.glb 800 | tee size.txt
          cat size.txt >> ../cast_out/$CHAR/log.txt
          ! grep -q '^FAIL' size.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cast_${{ matrix.char }}
          path: cast_out
          retention-days: 3

  collect:
    needs: [build, ring, gates, renders, web, cast, perf, gpu]
    # results only when something ran (owner requirement 6)
    if: always() && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[checks]') || startsWith(github.event.head_commit.message, '[gpu]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: results }
      - name: Commit results to ci-out/run-<n>
        run: |
          cd results
          echo "run ${GITHUB_RUN_NUMBER} sha ${GITHUB_SHA} build=${{ needs.build.result }} ring=${{ needs.ring.result }} gates=${{ needs.gates.result }} renders=${{ needs.renders.result }} web=${{ needs.web.result }} cast=${{ needs.cast.result }} perf=${{ needs.perf.result }} gpu=${{ needs.gpu.result }}" > SUMMARY.txt
          git init -q -b results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "results run ${GITHUB_RUN_NUMBER}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" results:ci-out/run-${GITHUB_RUN_NUMBER}
